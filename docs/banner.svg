<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="Image Resizer: change your image">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16203f"/>
      <stop offset="1" stop-color="#2f5bea"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9cc3ff"/>
      <stop offset="1" stop-color="#e3eeff"/>
    </linearGradient>
    <clipPath id="big"><rect x="700" y="70" width="300" height="225" rx="14"/></clipPath>
    <clipPath id="small"><rect x="1088" y="160" width="128" height="96" rx="8"/></clipPath>
  </defs>

  <rect width="1280" height="400" rx="24" fill="url(#bg)"/>

  <!-- Text -->
  <text x="72" y="150" fill="#ffffff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="64" font-weight="700">Image Resizer</text>
  <text x="74" y="208" fill="#cdd8ff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="32">Change your image.</text>

  <!-- Chips -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#ffffff">
    <rect x="72" y="250" width="78" height="38" rx="19" fill="#ffffff" fill-opacity="0.14"/>
    <text x="111" y="275" text-anchor="middle">480p</text>
    <rect x="160" y="250" width="78" height="38" rx="19" fill="#ffffff" fill-opacity="0.14"/>
    <text x="199" y="275" text-anchor="middle">720p</text>
    <rect x="248" y="250" width="90" height="38" rx="19" fill="#ffffff"/>
    <text x="293" y="275" text-anchor="middle" fill="#2f5bea">1080p</text>
    <rect x="348" y="250" width="58" height="38" rx="19" fill="#ffffff" fill-opacity="0.14"/>
    <text x="377" y="275" text-anchor="middle">4K</text>
    <rect x="416" y="250" width="150" height="38" rx="19" fill="#ffffff" fill-opacity="0.14"/>
    <text x="491" y="275" text-anchor="middle">−50% file size</text>
  </g>
  <text x="74" y="340" fill="#9fb2ef" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18">Built with MATLAB · runs on GNU Octave</text>

  <!-- Big picture -->
  <g clip-path="url(#big)">
    <rect x="700" y="70" width="300" height="225" fill="url(#sky)"/>
    <circle cx="930" cy="125" r="26" fill="#ffd166"/>
    <path d="M700 295 L790 180 L850 245 L900 200 L1000 295 Z" fill="#3a7d5c"/>
    <path d="M700 295 L760 230 L820 295 Z" fill="#2c5f46"/>
  </g>
  <rect x="700" y="70" width="300" height="225" rx="14" fill="none" stroke="#ffffff" stroke-opacity="0.7" stroke-width="3"/>
  <text x="850" y="330" text-anchor="middle" fill="#cdd8ff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18">4032 × 3024 · 5.0 MB</text>

  <!-- Arrow -->
  <path d="M1022 208 H1068" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <path d="M1056 196 L1070 208 L1056 220" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Small picture -->
  <g clip-path="url(#small)">
    <rect x="1088" y="160" width="128" height="96" fill="url(#sky)"/>
    <circle cx="1186" cy="183" r="11" fill="#ffd166"/>
    <path d="M1088 256 L1126 207 L1152 235 L1173 215 L1216 256 Z" fill="#3a7d5c"/>
    <path d="M1088 256 L1114 228 L1139 256 Z" fill="#2c5f46"/>
  </g>
  <rect x="1088" y="160" width="128" height="96" rx="8" fill="none" stroke="#ffffff" stroke-opacity="0.7" stroke-width="3"/>
  <text x="1152" y="290" text-anchor="middle" fill="#cdd8ff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18">960 × 720</text>
  <text x="1152" y="314" text-anchor="middle" fill="#cdd8ff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18">132 KB</text>
</svg>
