# Visits the live site every 12 hours so the free Hugging Face Space never goes to sleep.
# Set the repository variable SPACE_URL (Settings -> Secrets and variables -> Actions -> Variables),
# e.g. https://your-username-image-resizer.hf.space
name: Keep site awake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Visit the site
        run: curl --fail --silent --show-error --max-time 180 --retry 3 --retry-delay 30 "${{ vars.SPACE_URL }}/health"
