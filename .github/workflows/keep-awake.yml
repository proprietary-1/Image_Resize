# Visits the live site every 10 minutes so Render's free plan doesn't put it to sleep
# (it sleeps after 15 minutes without visitors).
name: Keep site awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Visit the site
        run: curl --fail --silent --show-error --max-time 180 --retry 3 --retry-delay 30 https://image-resize-hwbp.onrender.com/health
